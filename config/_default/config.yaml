baseURL: https://jaehyeon.me/
title: Jaehyeon Kim
theme: github.com/razonyang/hugo-theme-bootstrap
copyright: 'Copyright © 2023-{year} Jaehyeon Kim. All Rights Reserved.'
defaultContentLanguage: en
# hasCJKLanguage: true # Uncomment it if your content contains Chinese/Japanese/Korean Languages.
# defaultContentLanguageInSubdir: true
# disableLanguages:
#  - fr
#  - zh-cn
#  - zh-tw
timeout: "180s"
paginate: 10
# paginatePath: page
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true
# googleAnalytics: UA-123-45
# disqusShortname: yourdiscussshortname

# Hugo capitalises the first letter of a taxonomy list title by default, which
# renders the dbt series and tag as "Dbt" and PyFlink as "Pyflink". Needs Hugo
# 0.123.3 or later, where this option was added.
capitalizeListTitles: false

taxonomies:
  category: categories
  series: series
  tag: tags
  # authors: authors

build:
  writeStats: true

# module:
  # proxy: https://goproxy.cn

markup:
  highlight:
    lineNos: true
    lineNumbersInTable: false
    noClasses: false
  tableOfContents:
    endLevel: 6
    ordered: false
    startLevel: 2

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
  page:
    - HTML

# outputs:
#   home:
#     - HTML
#     - RSS
#   section:
#     blog:
#       - HTML
#       - RSS

outputFormats:
  RSS:
    mediaType: "application/rss+xml"
    baseName: "index"
    isPlainText: false
    notAlternative: true