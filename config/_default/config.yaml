baseURL: https://jaehyeon.me/
title: Jaehyeon Kim
theme: github.com/razonyang/hugo-theme-bootstrap
copyright: 'Copyright © 2023-{year} Jaehyeon Kim. All Rights Reserved.'
defaultContentLanguage: en
# hasCJKLanguage: true # Uncomment it if your content contains Chinese/Japanese/Korean Languages.
# defaultContentLanguageInSubdir: true
# disableLanguages:
#  - fr
#  - zh-cn
#  - zh-tw
timeout: "180s"
pagination:
  pagerSize: 10
  # path: page
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true
# googleAnalytics: UA-123-45
# disqusShortname: yourdiscussshortname

# Hugo capitalises the first letter of a taxonomy list title by default, which
# renders the dbt series and tag as "Dbt" and PyFlink as "Pyflink". Needs Hugo
# 0.123.3 or later, where this option was added.
capitalizeListTitles: false

taxonomies:
  category: categories
  series: series
  tag: tags
  # authors: authors

build:
  buildStats:
    enable: true

# module:
  # proxy: https://goproxy.cn

markup:
  highlight:
    lineNos: true
    lineNumbersInTable: false
    noClasses: false
  tableOfContents:
    endLevel: 6
    ordered: false
    startLevel: 2

outputs:
  home:
    - HTML
    - RSS
    # llms.txt at the site root, an index of the posts for AI assistants
    # (llmstxt.org). Built by layouts/home.llms.txt.
    - llms
  section:
    - HTML
    - RSS
  page:
    - HTML

# outputs:
#   home:
#     - HTML
#     - RSS
#   section:
#     blog:
#       - HTML
#       - RSS

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
  RSS:
    mediaType: "application/rss+xml"
    baseName: "index"
    isPlainText: false
    notAlternative: true
# Related posts match on series and tags. One or two shared categories on their own score
# below the threshold, so a category only raises the rank of a post that also shares a tag or
# series. Hugo divides the threshold by the number of matches, so three shared categories
# would pass; no pair of posts on this site shares three categories and nothing else.
# Hugo 0.145.0 stopped giving every post the site's params.keywords, which used to make
# every post match every other.
# includeNewer lets a post list later posts too, so the first part of a series lists the
# parts after it. toLower matches tags written in different letter case as one tag.
related:
  includeNewer: true
  threshold: 80
  toLower: true
  indices:
    - name: series
      weight: 100
    - name: tags
      weight: 80
    - name: categories
      weight: 40
    - name: date
      weight: 10
