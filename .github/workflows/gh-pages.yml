name: GitHub Pages
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      # Hugo resolves the theme module with the go binary. Without this step it
      # works only because the runner image happens to ship Go.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # Hugo 0.170.0 removed LibSass, so the theme's SCSS is compiled by the Dart Sass
      # binary, which Hugo finds on PATH. This step follows Hugo's GitHub Pages guide.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.108.2
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${{ runner.temp }}" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${{ runner.temp }}/dart-sass" >> "${GITHUB_PATH}"

      # Hugo 0.170.0 and later have one edition, so there is no extended build to ask for.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'

      - name: Build
        run: hugo --minify --gc --enableGitInfo --buildFuture

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
